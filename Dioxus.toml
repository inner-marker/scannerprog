[application]

[bundle]
publisher = "Inner-Marker"
identifier = "com.innermarker-scannerprog"
icon = [
  "assets/sp-icons/icon-128.png",
  "assets/sp-icons/icon.icns",
  "assets/sp-icons/icon.ico",
]


# Runtime dependencies; dx uses this list for both the .deb and the .rpm
[bundle.deb]
# RPM soname capability: pulls in webkit2gtk4.1 on Fedora
depends = ["libwebkit2gtk-4.1.so.0()(64bit)"]